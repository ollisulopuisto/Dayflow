name: Rebuild on upstream release

# Once a day, check upstream (JerryZLiu/Dayflow) for a new release. If there is one that this
# fork has not built yet, merge that release in CI, build it, publish the merged source on a durable
# ref, and publish the app as a GitHub release.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Find the latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/JerryZLiu/Dayflow/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "fork-$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already built: fork-$tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release
        if: steps.upstream.outputs.skip == 'false'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "dayflow-fork-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags https://github.com/JerryZLiu/Dayflow.git "refs/tags/$TAG:refs/tags/upstream-$TAG"
          if ! git merge --no-edit "upstream-$TAG"; then
            git merge --abort
            echo "::error::Upstream $TAG conflicts with the fork's changes; merge it by hand."
            exit 1
          fi
          # Fail closed: upstream's update feed must not come back into this build.
          if grep -q "dayflow.so/appcast" Dayflow/Dayflow/Info.plist; then
            echo "::error::Upstream's update feed is back in Info.plist; refusing to build."
            exit 1
          fi

      - name: Build Dayflow
        if: steps.upstream.outputs.skip == 'false'
        run: >-
          xcodebuild
          -project Dayflow/Dayflow.xcodeproj
          -scheme Dayflow
          -configuration Release
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Publish built source ref
        id: source
        if: steps.upstream.outputs.skip == 'false'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          source_ref="upstream-builds/fork-$TAG"
          git push origin "HEAD:refs/heads/$source_ref"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Package and publish
        if: steps.upstream.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Dayflow.app Dayflow-macos.zip
          gh release create "fork-$TAG" Dayflow-macos.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_REF" \
            --title "Dayflow fork built from upstream $TAG" \
            --notes "Upstream $TAG merged into main; durable source ref $SOURCE_REF (commit $(git rev-parse --short HEAD)). Unsigned build."

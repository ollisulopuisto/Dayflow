name: Build macOS app

on:
  push:
    branches:
      - main
      - koti-batching
    paths-ignore:
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit tests for an urgent hotfix artifact build'
        type: boolean
        required: false
        default: false
  schedule:
    # Run the complete XCTest suite weekly to catch stale impact mappings.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # A one-commit push compares against its first parent; deeper batches
          # fall back to the full suite when the base is not present locally.
          fetch-depth: 2
      - name: Select affected XCTest suites
        id: test-selection
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: python3 scripts/ci/select_xcode_test_suites.py >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        env:
          TEST_MODE: ${{ steps.test-selection.outputs.mode }}
          TEST_SUITES: ${{ steps.test-selection.outputs.suites }}
          TEST_REASON: ${{ steps.test-selection.outputs.reason }}
        run: |
          set -euo pipefail
          echo "Test selection: $TEST_MODE ($TEST_REASON)"
          # Keep the array non-empty: macOS system Bash treats expanding an
          # empty array under `set -u` as an unbound variable.
          test_args=(-derivedDataPath build CODE_SIGNING_ALLOWED=NO)
          if [[ "$TEST_MODE" == selected ]]; then
            IFS="," read -r -a suites <<< "$TEST_SUITES"
            for suite in "${suites[@]}"; do
              test_args+=("-only-testing:DayflowTests/$suite")
            done
          fi
          xcodebuild \
            -project Dayflow/Dayflow.xcodeproj \
            -scheme Dayflow \
            -configuration Debug \
            -destination "platform=macOS" \
            "${test_args[@]}" \
            test
      - name: Skip unit tests for urgent build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests }}
        run: echo 'Unit tests skipped by explicit workflow_dispatch input; artifact build continues.'
      - name: Build Dayflow release artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: >-
          xcodebuild
          -project Dayflow/Dayflow.xcodeproj
          -scheme Dayflow
          -configuration Release
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package app
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Dayflow.app Dayflow-macos.zip
          hdiutil create \
            -volname Dayflow \
            -srcfolder build/Build/Products/Release/Dayflow.app \
            -ov \
            -format UDZO \
            Dayflow-macos.dmg
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: Dayflow-macos-${{ github.sha }}
          path: |
            Dayflow-macos.zip
            Dayflow-macos.dmg
          if-no-files-found: error
          retention-days: 14

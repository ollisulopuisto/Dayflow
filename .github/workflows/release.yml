name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APP_NAME: Dayflow
  SCHEME: Dayflow
  CONFIG: Release
  PROJECT_PATH: Dayflow/Dayflow.xcodeproj
  DERIVED_DATA: build
  # Background image for the DMG window (committed in the repo)
  DMG_BG: docs/assets/dmg-background.png

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual release dispatch must target a version tag. This prevents a
      # dispatch from main from trying to publish a release named "main".
      - name: Validate release ref
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "ERROR: Release builds must run from a v* version tag (got $GITHUB_REF)." >&2
              exit 1
              ;;
          esac

      #-----------------------------------------------------------------------------
      # Resolve the versioned DMG name from the project's marketing version so
      # downloaded installers are distinguishable. Writes DMG_NAME for all later
      # steps (env context in run blocks is interpolated per step at runtime).
      #-----------------------------------------------------------------------------
      - name: Resolve versioned DMG name
        run: |
          VERSION=$(grep -m1 -E "MARKETING_VERSION = " "${{ env.PROJECT_PATH }}/project.pbxproj" | sed -E 's/.*MARKETING_VERSION = ([^;]+);/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: MARKETING_VERSION not found in ${{ env.PROJECT_PATH }}/project.pbxproj" >&2
            exit 1
          fi
          echo "DMG_NAME=${{ env.APP_NAME }}-${VERSION}.dmg" >> "$GITHUB_ENV"
          echo "DMG name: ${{ env.APP_NAME }}-${VERSION}.dmg"

      #-----------------------------------------------------------------------------
      # Install tools: create-dmg (not pre-installed on GH Actions macOS runners)
      #-----------------------------------------------------------------------------
      - name: Install create-dmg
        run: |
          brew install create-dmg

      #-----------------------------------------------------------------------------
      # Import Developer ID signing certificate (optional).
      # Map the repository's generic base64 .p12 and password secrets to the
      # names this workflow uses; secret values stay in the environment.
      #-----------------------------------------------------------------------------
      - name: Credential transport guards
        run: python3 -m unittest discover -s scripts/tests -p test_release_credentials.py -v

      - name: Native dummy-keychain transport smoke check
        run: python3 tests/manual/test_macos_keychain_transport.py -v

      - name: Import code-signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERTIFICATE_P12" ]]; then
            echo "No BUILD_CERTIFICATE_BASE64 secret; skipping code signing."
            echo "SIGN_ID=" >> $GITHUB_ENV
            exit 0
          fi
          set -euo pipefail
          test -n "$SIGNING_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/dayflow-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/dayflow-certificate.p12"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 -D -o "$CERTIFICATE_PATH"
          export KEYCHAIN_PATH CERTIFICATE_PATH
          export P12_PASSWORD="$SIGNING_CERTIFICATE_PASSWORD"
          python3 scripts/macos_ci_credentials.py import-certificate
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          if [[ -z "$SIGN_ID" ]]; then
            echo "ERROR: No Developer ID Application identity found in imported certificate." >&2
            exit 1
          fi
          echo "SIGN_ID=$SIGN_ID" >> $GITHUB_ENV

      #-----------------------------------------------------------------------------
      # Build the app with the Developer ID team and manual signing when a
      # certificate is available. The project defaults to the author's Personal
      # Team and automatic signing, which conflicts with Developer ID identities
      # and also prevents SwiftPM targets from resolving their signing team.
      #-----------------------------------------------------------------------------
      - name: Build app
        env:
          # DAYFLOW_BACKEND_URL is injected into Info.plist at build time.
          # Set it as a repository secret for a functional release build.
          DAYFLOW_BACKEND_URL: ${{ secrets.DAYFLOW_BACKEND_URL }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          XCODE_ARGS=(
            -project "${{ env.PROJECT_PATH }}"
            -scheme "${{ env.SCHEME }}"
            -configuration "${{ env.CONFIG }}"
            -derivedDataPath "${{ env.DERIVED_DATA }}"
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          )
          if [[ -n "${SIGN_ID:-}" ]]; then
            XCODE_ARGS+=(CODE_SIGN_IDENTITY="$SIGN_ID" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=LWSR8T5392 CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES)
          else
            XCODE_ARGS+=(CODE_SIGNING_ALLOWED=NO)
          fi
          if [[ -n "${DAYFLOW_BACKEND_URL:-}" ]]; then
            XCODE_ARGS+=(DAYFLOW_BACKEND_URL="$DAYFLOW_BACKEND_URL")
          fi
          if [[ -n "${POSTHOG_API_KEY:-}" ]]; then
            XCODE_ARGS+=(POSTHOG_API_KEY="$POSTHOG_API_KEY")
          fi
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            XCODE_ARGS+=(SENTRY_DSN="$SENTRY_DSN")
          fi
          xcodebuild "${XCODE_ARGS[@]}" build

      - name: Verify release contents
        run: |
          set -euo pipefail
          APP_PATH="${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIG }}/${{ env.APP_NAME }}.app"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/${{ env.APP_NAME }}")" = arm64
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          cmp CHANGELOG.md "$APP_PATH/Contents/Resources/CHANGELOG.md"

      #-----------------------------------------------------------------------------
      # Codesign the app bundle + frameworks (only when a cert was imported).
      #-----------------------------------------------------------------------------
      - name: Codesign app bundle
        run: |
          if [[ -z "${SIGN_ID:-}" ]]; then
            echo "No signing identity; skipping codesign."
            exit 0
          fi
          APP_PATH="${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIG }}/${{ env.APP_NAME }}.app"
          echo "Codesigning $APP_PATH…"
          # Sign helper binaries first
          CLI_BINARY="$APP_PATH/Contents/Helpers/dayflow"
          if [[ -f "$CLI_BINARY" ]]; then
            codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$CLI_BINARY"
          fi
          # Sign Sparkle helpers (Sparkle sandboxing guide)
          SPARKLE_DIR="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B"
          if [[ -d "$SPARKLE_DIR" ]]; then
            [[ -d "$SPARKLE_DIR/XPCServices/Installer.xpc" ]] && \
              codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$SPARKLE_DIR/XPCServices/Installer.xpc" || true
            [[ -d "$SPARKLE_DIR/XPCServices/Downloader.xpc" ]] && \
              codesign -vvv --force --options runtime --timestamp --preserve-metadata=entitlements --sign "$SIGN_ID" "$SPARKLE_DIR/XPCServices/Downloader.xpc" || true
            [[ -f "$SPARKLE_DIR/Autoupdate" ]] && \
              codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$SPARKLE_DIR/Autoupdate" || true
            [[ -d "$SPARKLE_DIR/Updater.app" ]] && \
              codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$SPARKLE_DIR/Updater.app" || true
            codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$SPARKLE_DIR/../../Current" 2>/dev/null || \
              codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$SPARKLE_DIR" || true
          fi
          # Xcode leaves Sentry's vendored framework signed without a secure
          # timestamp. Apple rejects the whole DMG unless it is re-signed for
          # Developer ID distribution before sealing the outer app bundle.
          SENTRY_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sentry.framework"
          if [[ -d "$SENTRY_FRAMEWORK" ]]; then
            codesign -vvv --force --options runtime --timestamp --sign "$SIGN_ID" "$SENTRY_FRAMEWORK"
            codesign --verify --strict --verbose=2 "$SENTRY_FRAMEWORK"
          fi
          # Sign the app bundle itself
          codesign -vvv --force --strict --options runtime --timestamp \
            --entitlements Dayflow/Dayflow/Dayflow.entitlements \
            --sign "$SIGN_ID" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl -a -vvv --type execute "$APP_PATH" || true

      #-----------------------------------------------------------------------------
      # Create the DMG with create-dmg.
      #-----------------------------------------------------------------------------
      - name: Create DMG
        run: |
          APP_PATH="${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIG }}/${{ env.APP_NAME }}.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "ERROR: Built app not found at $APP_PATH" >&2
            exit 1
          fi
          if [[ ! -f "${{ env.DMG_BG }}" ]]; then
            echo "ERROR: Background image not found at ${{ env.DMG_BG }}" >&2
            exit 1
          fi
          rm -f "${{ env.DMG_NAME }}"
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --background "${{ env.DMG_BG }}" \
            --window-size 775 480 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}.app" 200 270 \
            --app-drop-link 575 270 \
            --no-internet-enable \
            "${{ env.DMG_NAME }}" \
            "$APP_PATH"
          echo "DMG created: ${{ env.DMG_NAME }} ($(stat -f%z "${{ env.DMG_NAME }}") bytes)"

      - name: Sign and verify DMG
        run: |
          if [[ -z "${SIGN_ID:-}" ]]; then
            echo "No signing identity; leaving DMG unsigned."
            exit 0
          fi
          codesign --force --timestamp --sign "$SIGN_ID" "${{ env.DMG_NAME }}"
          codesign --verify --verbose=2 "${{ env.DMG_NAME }}"

      #-----------------------------------------------------------------------------
      # Notarize every release DMG. Credentials must be configured as repository secrets.
      #-----------------------------------------------------------------------------
      - name: Notarize DMG
        env:
          # Same secret names as the other signed repos; the NOTARY_* names still win if set.
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID || secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD || secrets.APPLE_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID || 'LWSR8T5392' }}
        run: |
          set -euo pipefail
          if [[ -z "$NOTARY_APPLE_ID" || -z "$NOTARY_APP_PASSWORD" ]]; then
            echo "::error::APPLE_ID / APPLE_APP_PASSWORD secrets are missing; a release must be notarised."
            exit 1
          fi
          export APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_PASSWORD="$NOTARY_APP_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          export KEYCHAIN_PATH="$RUNNER_TEMP/dayflow-signing.keychain-db"
          python3 scripts/macos_ci_credentials.py store-notary-credentials
          echo "Submitting DMG for notarization…"
          SUBMISSION=$(xcrun notarytool submit "${{ env.DMG_NAME }}" \
            --keychain-profile dayflow-ci-notary --keychain "$KEYCHAIN_PATH" \
            --output-format json \
            --wait)
          echo "$SUBMISSION"
          SUBMISSION_ID=$(echo "$SUBMISSION" | jq -r '.id')
          STATUS=$(echo "$SUBMISSION" | jq -r '.status')
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::Apple notarization finished with status: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --keychain-profile dayflow-ci-notary --keychain "$KEYCHAIN_PATH" \
              --output-format json || true
            exit 1
          fi
          # Ticket delivery can briefly fail at Apple's CloudKit edge even
          # after notarization is Accepted. Retry the staple operation before
          # failing the release, then validate the ticket is attached.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "${{ env.DMG_NAME }}"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Stapling failed after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Stapling attempt $attempt failed; retrying in ${delay}s…"
            sleep "$delay"
          done
          xcrun stapler validate "${{ env.DMG_NAME }}"
          spctl -a -vvv --type open --context context:primary-signature "${{ env.DMG_NAME }}"
          shasum -a 256 "${{ env.DMG_NAME }}" | tee "${{ env.DMG_NAME }}.sha256"
          shasum -a 256 -c "${{ env.DMG_NAME }}.sha256"
          echo "Notarization complete."

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/dayflow-signing.keychain-db" || true

      #-----------------------------------------------------------------------------
      # Create GitHub Release and upload the DMG as an asset.
      #-----------------------------------------------------------------------------
      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_NUM="${TAG#v}"
          TITLE="${{ env.APP_NAME }} $TAG"
          NOTES_FILE="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            # Try to extract the section for this version from CHANGELOG.md
            sed -n "/^## .*${TAG_NUM//./\\.}/,/^## /p" CHANGELOG.md 2>/dev/null | sed '$d' > "$NOTES_FILE" || true
            if [[ ! -s "$NOTES_FILE" ]]; then
              echo "See CHANGELOG.md for full details." > "$NOTES_FILE"
            fi
          else
            echo "See CHANGELOG.md for full details." > "$NOTES_FILE"
          fi
          gh release create "$TAG" "${{ env.DMG_NAME }}" "${{ env.DMG_NAME }}.sha256" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --draft=false
          rm -f "$NOTES_FILE"
          ASSET_URL=$(gh release view "$TAG" --json assets -q \
            ".assets[] | select(.name==\"${{ env.DMG_NAME }}\").url" 2>/dev/null || true)
          echo "asset_url=$ASSET_URL" >> $GITHUB_OUTPUT
          echo "release_url=$(gh release view "$TAG" --json url -q .url)" >> $GITHUB_OUTPUT
          echo "Created release: $TAG"

      #-----------------------------------------------------------------------------
      # Upload dSYM to Sentry (optional) for crash symbolication.
      #-----------------------------------------------------------------------------
      - name: Upload dSYM to Sentry
        run: |
          if [[ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" || -z "${{ secrets.SENTRY_ORG }}" || -z "${{ secrets.SENTRY_PROJECT }}" ]]; then
            echo "No Sentry credentials; skipping dSYM upload."
            exit 0
          fi
          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "sentry-cli not installed; skipping dSYM upload."
            exit 0
          fi
          DSYM_PATH="${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIG }}/${{ env.APP_NAME }}.app.dSYM"
          if [[ -d "$DSYM_PATH" ]]; then
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIG }}/${{ env.APP_NAME }}.app/Contents/Info.plist")
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${{ env.DERIVED_DATA }}/Build/Products/${{ env.CONFIG }}/${{ env.APP_NAME }}.app/Contents/Info.plist")
            sentry-cli upload-dif \
              --org "${{ secrets.SENTRY_ORG }}" \
              --project "${{ secrets.SENTRY_PROJECT }}" \
              "$DSYM_PATH"
            echo "dSYM uploaded for $VERSION+$BUILD"
          else
            echo "dSYM not found at $DSYM_PATH; skipping upload."
          fi
